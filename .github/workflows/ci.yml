name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Real-bug rules only (syntax errors, undefined names); style stays advisory.
      - run: ruff check scripts/ skill.py --select E9,F63,F7,F821,F823
      - run: ruff check scripts/ locales/ --select E,F,W --ignore E501 --exit-zero

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest "mcp>=2.0.0"
      - name: Package builds and installs
        run: pip install . --no-deps --target ${{ runner.temp }}/pkgcheck
      - run: pytest tests/ locales/tests/ -q
