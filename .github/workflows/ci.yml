name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pip install "mcp>=1.0.0"
      - run: pip install ruff
      - run: ruff check scripts/ locales/ --select E,F,W --ignore E501 || true
      - run: pytest tests/ locales/tests/ -x -q
